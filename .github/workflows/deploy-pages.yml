name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure original PNG artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/original

          download_png() {
            url="$1"
            out="$2"
            min_bytes="$3"

            if [ -f "$out" ]; then
              size=$(stat -c%s "$out")
              if [ "$size" -ge "$min_bytes" ]; then
                echo "Using existing $out ($size bytes)"
                return 0
              fi
            fi

            echo "Downloading original artwork -> $out"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 "$url" -o "$out"

            python - "$out" "$min_bytes" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          minimum = int(sys.argv[2])
          raw = path.read_bytes()
          if len(raw) < minimum:
              raise SystemExit(f'{path} is unexpectedly small: {len(raw)} bytes')
          if raw[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit(f'{path} is not a valid PNG file')
          print(f'Verified {path}: {len(raw)} bytes')
          PY
          }

          download_png 'https://at.adobe.com/mGuU6OimruCFNHed' 'assets/original/hero-bg.png' 2000000
          download_png 'https://at.adobe.com/yTPsdIRF6snhgxUp' 'assets/original/portrait.png' 2200000
          download_png 'https://at.adobe.com/T83npomdfC5oyllk' 'assets/original/action.png' 2300000
          download_png 'https://at.adobe.com/TTpxWHHQ5Ra327pG' 'assets/original/scene.png' 2200000
          download_png 'https://at.adobe.com/UdrNFOc2LclrgTrX' 'assets/original/fan.png' 2100000

      - name: Persist original artwork in repository
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=all assets/original)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/original
            git commit -m 'Store original generated PNG artwork [skip ci]'
            git push origin HEAD:main
          else
            echo 'Original artwork is already committed.'
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
