name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild background
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import base64
          root = Path('_bg900')
          parts = [root / f'part{i:02d}' for i in range(16)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('Missing background chunks: ' + ', '.join(missing))
          text = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          text += '=' * ((4 - len(text) % 4) % 4)
          raw = base64.b64decode(text, validate=False)
          Path('bg.webp').write_bytes(raw)
          print('Rebuilt bg.webp:', len(raw), 'bytes')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
