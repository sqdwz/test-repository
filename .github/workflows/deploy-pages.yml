name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild background
        shell: bash
        run: |
          set -euo pipefail
          cat _bg900/part{00..15} | tr -d '\r\n ' > bg.b64
          base64 -d bg.b64 > bg.webp
          test -s bg.webp
          python <<'PY'
          from pathlib import Path
          data = Path('bg.webp').read_bytes()
          if len(data) < 20000:
              raise SystemExit(f'bg.webp too small: {len(data)} bytes')
          if not (data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
              raise SystemExit('bg.webp is not a valid WEBP container')
          print(f'Background rebuilt: {len(data)} bytes')
          PY
          rm -f bg.b64

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
