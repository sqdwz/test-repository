<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>澄迈县金江镇楼盘市场调研库</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#162033;--muted:#667085;--line:#e5eaf1;--blue:#2563eb;--green:#0f766e;--shadow:0 12px 34px rgba(20,32,51,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:radial-gradient(circle at 5% -10%,#dbeafe 0,transparent 28rem),var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1480px;margin:auto;padding:18px 22px 48px}
header{position:sticky;top:0;z-index:30;margin:-18px -22px 18px;padding:14px 22px;background:rgba(244,247,251,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(229,234,241,.9)}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;font-weight:800}h1{font-size:19px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.box{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.intro{padding:22px}.tag{display:inline-block;background:#edf4ff;color:#2453a6;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700}.intro h2{font-size:28px;margin:12px 0 7px}.intro p{font-size:13px;line-height:1.75;color:var(--muted);margin:0}.search{margin-top:18px;border:1px solid #d7deea;background:#fff;border-radius:13px;display:flex;align-items:center;padding:0 12px}.search input{height:44px;flex:1;border:0;outline:0;background:transparent}.stats{padding:15px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:13px}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:17px 0 11px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #dbe2ec;background:#fff;color:#526071;border-radius:999px;padding:7px 11px;font-size:12px}.chip.on{background:#172033;color:#fff;border-color:#172033}.right{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}select{height:36px;border:1px solid #dbe2ec;border-radius:10px;background:#fff;color:#526071}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 5px 18px rgba(15,23,42,.04);position:relative;overflow:hidden;transition:.18s}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--green))}.card:hover{transform:translateY(-2px);box-shadow:0 13px 28px rgba(15,23,42,.08)}.head{display:flex;justify-content:space-between;gap:9px}.head h3{font-size:16px;margin:1px 0}.price{font-size:14px;font-weight:800;white-space:nowrap}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.badge{font-size:10px;font-weight:700;padding:4px 7px;border-radius:999px;background:#f1f5f9;color:#536174}.sale{background:#e9f7f1;color:#0f766e}.policy{background:#fff3e7;color:#9a4e0c}.stock{background:#f2f0ff;color:#6554c0}.lines{display:grid;gap:7px;margin-top:8px}.line{display:grid;grid-template-columns:52px 1fr;gap:7px;font-size:12px;line-height:1.5}.line span:first-child{color:#98a2b3}.line span:last-child{color:#465264;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.foot{border-top:1px dashed var(--line);margin-top:12px;padding-top:11px;display:flex;justify-content:space-between;align-items:center}.attach{font-size:11px;color:var(--muted)}.open{border:0;background:#edf4ff;color:#2453a6;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700}.empty{grid-column:1/-1;text-align:center;padding:60px;background:#fff;border:1px dashed #ccd6e3;border-radius:16px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.46);z-index:100;opacity:0;pointer-events:none;transition:.18s}.ov.show{opacity:1;pointer-events:auto}.drawer{position:absolute;right:0;top:0;height:100%;width:min(860px,94vw);background:#f7f9fc;transform:translateX(100%);transition:.22s;display:flex;flex-direction:column}.ov.show .drawer{transform:none}.dhead{background:#fff;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;gap:12px}.dhead h2{font-size:21px;margin:0 0 4px}.dhead p{font-size:11px;color:var(--muted);margin:0}.x{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:10px}.dbody{overflow:auto;padding:14px 16px 40px}.hero2{background:linear-gradient(135deg,#172033,#293b58);border-radius:15px;color:#fff;padding:16px;margin-bottom:11px;display:flex;justify-content:space-between;gap:15px}.hero2 small{color:#cbd5e1;line-height:1.7}.hero2 b{font-size:22px;text-align:right}.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.sec h4{font-size:13px;margin:0 0 11px}.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 13px}.item{border-bottom:1px dashed #edf0f5;padding-bottom:8px}.item.wide{grid-column:1/-1}.item label{display:block;font-size:10px;color:#98a2b3;margin-bottom:3px}.item div{font-size:12.5px;line-height:1.65;color:#344054;white-space:pre-wrap;word-break:break-word}.attbox{background:#f8fafc;border:1px dashed #d5dde8;border-radius:11px;padding:12px;color:#667085;font-size:12px;line-height:1.7}footer{text-align:center;color:#98a2b3;font-size:10px;margin-top:24px;line-height:1.7}
@media(max-width:1050px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.wrap{padding:12px 10px 36px}header{margin:-12px -10px 12px;padding:11px 10px}.intro{padding:17px}.intro h2{font-size:23px}.grid{grid-template-columns:1fr}.drawer{width:100vw}.info{grid-template-columns:1fr}.item.wide{grid-column:auto}.hero2{display:block}.hero2 b{display:block;text-align:left;margin-top:8px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="logo">金</div><div><h1>澄迈县金江镇楼盘市场调研库</h1><div class="sub">住宅项目 · 规划指标 · 价格销售 · 客群信息</div></div></div></header>
<section class="hero">
<div class="box intro"><span class="tag">MARKET RESEARCH · JINJIANG</span><h2>楼盘信息，一处查询</h2><p>将楼盘市场调研表转换为可搜索、可筛选、可展开查看的网页。缺失字段自动隐藏，长文本按模块展示。</p><div class="search"><input id="q" placeholder="搜索项目、开发商、位置、户型、价格、客群…"></div></div>
<div class="box stats"><div class="stat"><b id="s1">—</b><span>调研项目</span></div><div class="stat"><b id="s2">—</b><span>含附件项目</span></div><div class="stat"><b id="s3">—</b><span>在售 / 待售</span></div><div class="stat"><b id="s4">—</b><span>有价格信息</span></div></div>
</section>
<div class="tools"><div class="chips" id="chips"></div><div class="right"><span id="count"></span><select id="sort"><option value="name">按名称排序</option><option value="full">按资料完整度</option><option value="att">按附件数量</option></select></div></div>
<main class="grid" id="grid"></main>
<footer>数据来源：《(楼盘市场调研表)表格视图.xlsx》 · 页面用于调研资料整理，价格与销售状态以实际核验为准。</footer>
</div>
<div class="ov" id="ov"><aside class="drawer"><div class="dhead"><div><h2 id="title"></h2><p id="subtitle"></p></div><button class="x" id="close">×</button></div><div class="dbody" id="body"></div></aside></div>
<script src="data/part-01.js"></script>
<script src="data/part-02.js"></script>
<script src="data/part-03.js"></script>
<script src="data/part-04.js"></script>
<script src="data/part-05.js"></script>
<script src="data/part-06.js"></script>
<script src="data/part-07.js"></script>
<script src="data/part-08.js"></script>
<script src="data/part-09.js"></script>
<script src="data/part-10.js"></script>
<script src="data/part-11.js"></script>
<script src="data/part-12.js"></script>
<script src="data/part-13.js"></script>
<script>
const P=window.PROJECTS||[],miss=v=>!v||String(v).trim()==="/"||String(v).trim().toLowerCase()==="null",e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),v=(p,k)=>p.fields[k]||"";
const core=["联系电话","目前工程进度","项目类型及建筑形式","地理位置","开发商","物业管理公司","开盘日期","交房日期","占地面积","总建筑面积","容积率","绿化率","户数","均价","销售情况","户型","面积","物业管理费"];
function cat(p){let t=(v(p,"销售情况")+" "+v(p,"目前工程进度")+" "+v(p,"项目类型及建筑形式")).toLowerCase();if(/安居|保障|租赁式|单位\/保障/.test(t))return"政策住房";if(/在售|待售/.test(t))return"在售/待售";if(/售罄/.test(t))return"售罄";if(/存量|二手|租赁市场/.test(t))return"存量住宅";return"其他"}
function cls(c){return c==="政策住房"?"policy":c==="在售/待售"?"sale":c==="存量住宅"?"stock":""}function full(p){return Math.round(core.filter(k=>!miss(v(p,k))).length/core.length*100)}function price(p){for(let k of["均价","起价","最高价"])if(!miss(v(p,k)))return[k,v(p,k)];return null}
let st={q:"",f:"全部",s:"name"},cats=["全部","在售/待售","存量住宅","政策住房","售罄","有附件"];
function filters(){chips.innerHTML=cats.map(x=>`<button class="chip ${st.f===x?"on":""}" data-f="${x}">${x}</button>`).join("");document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{st.f=b.dataset.f;filters();render()})}
function list(){let q=st.q.trim().toLowerCase(),a=P.filter(p=>{if(q&&![p.name,...Object.values(p.fields)].join(" ").toLowerCase().includes(q))return false;if(st.f==="有附件")return p.attachmentCount>0;return st.f==="全部"||cat(p)===st.f});if(st.s==="name")a.sort((a,b)=>a.name.localeCompare(b.name,"zh-CN"));if(st.s==="full")a.sort((a,b)=>full(b)-full(a));if(st.s==="att")a.sort((a,b)=>b.attachmentCount-a.attachmentCount);return a}
function render(){let a=list();count.textContent=`显示 ${a.length} / ${P.length}`;grid.innerHTML=a.length?a.map(p=>{let pr=price(p),c=cat(p);return`<article class="card"><div class="head"><h3>${e(p.name)}</h3><div class="price">${pr?e(pr[1]):"—"}</div></div><div class="badges"><span class="badge ${cls(c)}">${c}</span><span class="badge">资料 ${full(p)}%</span></div><div class="lines">${!miss(v(p,"地理位置"))?`<div class="line"><span>位置</span><span>${e(v(p,"地理位置"))}</span></div>`:""}${!miss(v(p,"开发商"))?`<div class="line"><span>开发商</span><span>${e(v(p,"开发商"))}</span></div>`:""}${!miss(v(p,"户型"))?`<div class="line"><span>户型</span><span>${e(v(p,"户型"))}</span></div>`:""}</div><div class="foot"><span class="attach">${p.attachmentCount?`附件 ${p.attachmentCount} 张`:"暂无附件"}</span><button class="open" data-id="${p.id}">查看详情</button></div></article>`}).join(""):`<div class="empty">没有匹配项目</div>`;document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openP(b.dataset.id))}
const defs=[["基本信息",["调查人员","联系电话","目前工程进度","项目类型及建筑形式","地理位置","投资商","开发商","建筑公司","物业管理公司","销售代理","建筑设计"]],["时间与规划指标",["开盘日期","交房日期","项目分期","占地面积","总建筑面积","得房率","楼间距","容积率","绿化率","户数","建筑风格","交楼标准"]],["小区配套",["小区配套设施-休闲","小区配套设施-购物","小区配套设施-入学"]],["价格与销售",["付款方式及优惠政策","起价","均价","最高价","差价","销售情况"]],["户型信息",["户型","推出数量","面积","户型特点"]],["物业与费用",["物业管理费","采暖费","各项杂费"]],["营销与项目评价",["主题推广语","项目优劣势或卖点","营销策划优劣势","现场执行优劣势"]],["客群特征",["客户来源","置业目的","居家结构","行业职业","关注点","产品偏好","来访客户标识"]],["备注",["备注"]]],wide=new Set(["地理位置","付款方式及优惠政策","户型特点","主题推广语","项目优劣势或卖点","营销策划优劣势","现场执行优劣势","备注","客户来源","置业目的","关注点","产品偏好","来访客户标识","小区配套设施-休闲","小区配套设施-购物","小区配套设施-入学"]);
function sec(p,n,fs){let a=fs.filter(k=>!miss(v(p,k)));return a.length?`<section class="sec"><h4>${n}</h4><div class="info">${a.map(k=>`<div class="item ${wide.has(k)?"wide":""}"><label>${e(k)}</label><div>${e(v(p,k))}</div></div>`).join("")}</div></section>`:""}
function openP(id){let p=P.find(x=>String(x.id)===String(id));if(!p)return;let pr=price(p),c=cat(p);title.textContent=p.name;subtitle.textContent=[c,!miss(v(p,"地理位置"))?v(p,"地理位置"):""].filter(Boolean).join(" · ");let hero=`<div class="hero2"><small>${e(v(p,"项目类型及建筑形式")||"住宅项目")}<br>${e(v(p,"开发商")||"开发商信息待补充")}</small><b>${pr?e(pr[1]):"—"}<br><small>${pr?pr[0]:"价格待核实"}</small></b></div>`;let att=p.attachmentCount?`<section class="sec"><h4>附件情况</h4><div class="attbox">原始调查表包含附件图片 ${p.attachmentCount} 张，其中户型图 ${p.floorplanCount} 张、价格截图 ${p.priceImageCount} 张。当前网页保留附件数量索引。</div></section>`:"";body.innerHTML=hero+defs.map(x=>sec(p,x[0],x[1])).join("")+att;ov.classList.add("show");document.body.style.overflow="hidden"}
close.onclick=()=>{ov.classList.remove("show");document.body.style.overflow=""};ov.onclick=x=>{if(x.target===ov)close.click()};q.oninput=x=>{st.q=x.target.value;render()};sort.onchange=x=>{st.s=x.target.value;render()};document.onkeydown=x=>{if(x.key==="Escape")close.click()};
s1.textContent=P.length;s2.textContent=P.filter(x=>x.attachmentCount).length;s3.textContent=P.filter(x=>cat(x)==="在售/待售").length;s4.textContent=P.filter(x=>price(x)).length;filters();render();
</script>
</body></html>
