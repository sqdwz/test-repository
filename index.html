<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111d43" />
  <title>神里绫华 · 月下水墨</title>
  <style>
    :root{
      --bg:#0e1838;
      --text:#f3f6ff;
      --muted:#d8e1f2;
      --line:rgba(255,255,255,.16);
      --accent:#efe8e2;
      --accent-text:#6f6466;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{
      font-family:"Noto Serif SC","Songti SC","STSong","Microsoft YaHei",serif;
      overflow-x:hidden;
    }
    a{text-decoration:none;color:inherit}

    .hero{
      position:relative;
      min-height:100vh;
      overflow:hidden;
      background:linear-gradient(180deg,#0c1738,#101c42 60%,#17265a);
      isolation:isolate;
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:url('./bg.webp');
      background-size:cover;
      background-position:center center;
      transform:scale(1.01);
      z-index:-3;
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(11,20,49,.58) 0%, rgba(11,20,49,.50) 16%, rgba(11,20,49,.24) 35%, rgba(11,20,49,.06) 58%, rgba(11,20,49,.12) 100%),
        linear-gradient(180deg, rgba(7,13,31,.08) 0%, rgba(7,13,31,.04) 52%, rgba(7,13,31,.18) 100%);
      z-index:-2;
      pointer-events:none;
    }

    .snow,.petals{position:absolute;inset:0;pointer-events:none;z-index:-1}
    .snow::before{
      content:"";
      position:absolute;inset:0;
      background-image:
        radial-gradient(circle at 10% 18%, rgba(255,255,255,.65) 0 1px, transparent 1.8px),
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.40) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 12%, rgba(255,255,255,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 28%, rgba(255,255,255,.45) 0 1px, transparent 2px),
        radial-gradient(circle at 16% 78%, rgba(255,255,255,.28) 0 1px, transparent 2px);
      opacity:.45;
    }
    .petals i{
      position:absolute;display:block;
      width:11px;height:7px;border-radius:90% 15% 80% 20%;
      background:rgba(255,220,232,.72);
      filter:blur(.2px);
      transform:rotate(var(--r));
      box-shadow:0 0 8px rgba(255,220,232,.18);
    }
    .petals i:nth-child(1){left:5%;top:31%;--r:18deg}
    .petals i:nth-child(2){left:14%;top:70%;--r:-24deg}
    .petals i:nth-child(3){left:46%;top:25%;--r:30deg}
    .petals i:nth-child(4){left:72%;top:18%;--r:-14deg}
    .petals i:nth-child(5){left:88%;top:61%;--r:36deg}
    .petals i:nth-child(6){left:82%;top:34%;--r:12deg}

    .wrap{
      width:min(1520px,96vw);
      margin:0 auto;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;
    }
    .topbar{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:28px;
      height:86px;
      position:relative;
      z-index:2;
    }
    .logo{display:flex;align-items:center;gap:12px;min-width:250px}
    .logo-mark{
      width:34px;height:34px;border-radius:50%;
      border:1px solid rgba(255,255,255,.6);
      display:grid;place-items:center;flex:0 0 auto;
      box-shadow:0 0 16px rgba(255,255,255,.08)
    }
    .logo-mark::before{content:"✿";font-size:18px;opacity:.95}
    .logo-text strong{display:block;font-size:19px;line-height:1;letter-spacing:.16em;font-weight:500}
    .logo-text span{display:block;margin-top:4px;font-size:10px;letter-spacing:.3em;color:#c6d0e7;opacity:.92}

    .nav{display:flex;justify-content:center;align-items:center;gap:58px;font:16px/1 "Microsoft YaHei",sans-serif}
    .nav a{position:relative;color:#f6f8ff;opacity:.96}
    .nav a.active::after{
      content:"";
      position:absolute;left:50%;transform:translateX(-50%);bottom:-18px;
      width:24px;height:2px;border-radius:999px;
      background:#e8f1ff;box-shadow:0 0 14px rgba(232,241,255,.55);
    }
    .login{
      padding:12px 24px;border:1px solid rgba(255,255,255,.28);border-radius:12px;
      background:rgba(255,255,255,.04);backdrop-filter:blur(12px);
      font:15px/1 "Microsoft YaHei",sans-serif;color:#f4f7ff;
    }

    .main{
      flex:1;display:grid;grid-template-columns:minmax(320px, 560px) 1fr;align-items:center;
      padding:58px 0 154px;
    }
    .copy{padding-left:2.5vw;position:relative;z-index:2}
    .title-cn{
      margin:0;
      font-size:clamp(70px,7vw,112px);
      line-height:.98;
      letter-spacing:.04em;
      font-weight:600;
      text-shadow:0 8px 30px rgba(6,10,22,.25);
    }
    .subtitle{
      margin:28px 0 22px;
      color:#e8edf8;
      font-size:clamp(22px,2vw,34px);
      letter-spacing:.16em;
    }
    .decor{display:flex;align-items:center;gap:14px;margin-bottom:18px;color:rgba(255,255,255,.58)}
    .decor::before,.decor::after{content:"";display:block;height:1px;width:80px;background:linear-gradient(90deg, rgba(255,255,255,.28), rgba(255,255,255,.03))}
    .decor i{font-style:normal;font-size:18px;opacity:.9}
    .lead{
      margin:0;color:#eef3ff;
      font:18px/2.05 "Microsoft YaHei",sans-serif;
      text-shadow:0 3px 12px rgba(6,10,22,.18);
    }
    .cta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:28px}
    .cta{
      min-height:58px;padding:0 38px;border-radius:14px;
      border:1px solid rgba(240,229,221,.7);
      background:linear-gradient(180deg, rgba(255,249,245,.98), rgba(241,233,227,.94));
      box-shadow:0 12px 30px rgba(10,18,40,.16), inset 0 0 0 1px rgba(255,255,255,.25);
      color:var(--accent-text);font:500 18px/1 "Microsoft YaHei",sans-serif;
      display:inline-flex;align-items:center;gap:16px;
    }
    .cta .flower{font-size:20px;opacity:.72}

    .bottom-nav{
      position:absolute;left:0;right:0;bottom:8px;
      display:grid;grid-template-columns:repeat(4,1fr);gap:0;
      padding:0 4vw;
    }
    .bottom-item{
      position:relative;display:flex;align-items:center;justify-content:center;gap:16px;
      padding:22px 12px 28px;
      background:linear-gradient(180deg, rgba(11,18,44,.02), rgba(11,18,44,.14));
      backdrop-filter:blur(8px);
    }
    .bottom-item:not(:last-child)::after{
      content:"";position:absolute;right:0;top:28%;bottom:28%;width:1px;background:rgba(255,255,255,.12)
    }
    .icon-ring{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.56);display:grid;place-items:center;box-shadow:0 0 24px rgba(255,255,255,.05)}
    .icon-ring::before{content:"✿";font-size:21px}
    .item-text h4{margin:0 0 8px;font-size:17px;font-weight:500;color:#f4f7ff}
    .item-text p{margin:0;font:14px/1.8 "Microsoft YaHei",sans-serif;color:#e0e6f6}
    .scroll-indicator{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:34px;line-height:1;color:#f1f5ff;opacity:.96;pointer-events:none}

    @media (max-width: 1100px){
      .wrap{width:94vw}
      .nav{gap:34px;font-size:15px}
      .main{grid-template-columns:1fr;align-items:end;padding-top:36px;padding-bottom:220px}
      .copy{max-width:580px;padding-left:0}
      .bottom-nav{grid-template-columns:repeat(2,1fr);padding:0 0 14px}
      .bottom-item:nth-child(2)::after{display:none}
    }
    @media (max-width: 760px){
      .topbar{grid-template-columns:1fr auto;height:74px;gap:12px}
      .logo{min-width:0}
      .logo-text strong{font-size:15px}
      .logo-text span{display:none}
      .nav{display:none}
      .login{padding:10px 16px;font-size:13px}
      .main{padding:22px 0 290px}
      .copy{padding:0 2px}
      .title-cn{font-size:58px}
      .subtitle{font-size:22px;letter-spacing:.1em}
      .lead{font-size:15px;line-height:1.95}
      .decor::before,.decor::after{width:54px}
      .cta{min-height:52px;padding:0 24px;font-size:16px}
      .bottom-nav{grid-template-columns:1fr;gap:6px;padding-bottom:22px}
      .bottom-item{justify-content:flex-start;padding:14px 10px 14px 4px}
      .bottom-item::after{display:none!important}
      .item-text h4{font-size:15px}
      .item-text p{font-size:12px}
      .scroll-indicator{display:none}
      .hero::after{
        background:linear-gradient(180deg, rgba(11,20,49,.18) 0%, rgba(11,20,49,.18) 30%, rgba(11,20,49,.55) 58%, rgba(11,20,49,.82) 100%);
      }
      .hero::before{background-position:68% center}
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="snow"></div>
    <div class="petals"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="wrap">
      <header class="topbar">
        <div class="logo">
          <div class="logo-mark"></div>
          <div class="logo-text">
            <strong>KAMISATO AYAKA</strong>
            <span>INK · MOON · FROST</span>
          </div>
        </div>
        <nav class="nav" aria-label="主导航">
          <a class="active" href="#">首页</a>
          <a href="#">关于我们</a>
          <a href="#">服务中心</a>
          <a href="#">资讯动态</a>
          <a href="#">联系我们</a>
        </nav>
        <a class="login" href="#">登录 / 注册</a>
      </header>

      <main class="main">
        <section class="copy">
          <h1 class="title-cn">神里绫华</h1>
          <div class="subtitle">白鹭霜华 · 剑舞如梦</div>
          <div class="decor"><i>✧</i></div>
          <p class="lead">
            天地万象，皆在一念之间<br>
            愿此身如冰雪，护一方安宁
          </p>
          <div class="cta-row">
            <a class="cta" href="#"><span>探索更多</span><span class="flower">✿</span></a>
          </div>
        </section>
      </main>

      <div class="bottom-nav">
        <div class="bottom-item">
          <div class="icon-ring"></div>
          <div class="item-text"><h4>冰华之舞</h4><p>角色介绍</p></div>
        </div>
        <div class="bottom-item">
          <div class="icon-ring"></div>
          <div class="item-text"><h4>白鹭庭中</h4><p>故事背景</p></div>
        </div>
        <div class="bottom-item">
          <div class="icon-ring"></div>
          <div class="item-text"><h4>寒霜剑艺</h4><p>技能展示</p></div>
        </div>
        <div class="bottom-item">
          <div class="icon-ring"></div>
          <div class="item-text"><h4>花与雪</h4><p>精美图库</p></div>
        </div>
      </div>
      <div class="scroll-indicator">⌄</div>
    </div>
  </section>
</body>
</html>
